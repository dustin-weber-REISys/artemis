apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: arkmq-operator
  namespace: PLACEHOLDER_ARGOCD_NAMESPACE
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - list:
        elements:
          - environment: test
            clusterName: PLACEHOLDER_TEST_EKS_CLUSTER
            clusterServer: https://PLACEHOLDER_TEST_EKS_API_SERVER
            platformNamespace: PLACEHOLDER_PLATFORM_NAMESPACE
          - environment: nonprod
            clusterName: PLACEHOLDER_NONPROD_EKS_CLUSTER
            clusterServer: https://PLACEHOLDER_NONPROD_EKS_API_SERVER
            platformNamespace: PLACEHOLDER_PLATFORM_NAMESPACE
          - environment: prod
            clusterName: PLACEHOLDER_PROD_EKS_CLUSTER
            clusterServer: https://PLACEHOLDER_PROD_EKS_API_SERVER
            platformNamespace: PLACEHOLDER_PLATFORM_NAMESPACE
  template:
    metadata:
      name: '{{.environment}}-arkmq-operator'
      namespace: PLACEHOLDER_ARGOCD_NAMESPACE
      annotations:
        argocd.argoproj.io/sync-wave: "-20"
    spec:
      project: messaging-platform
      sources:
        # The upstream ArkMQ chart is mirrored and scanned in ECR before Argo
        # CD consumes it. The ECR repository credential is configured outside Git.
        - repoURL: PLACEHOLDER_ECR_REGISTRY
          chart: PLACEHOLDER_MIRRORED_ARKMQ_OPERATOR_CHART
          targetRevision: 2.2.0
          helm:
            valueFiles:
              - '$values/environments/{{.environment}}/operator-values.yaml'
        - repoURL: https://example.invalid/PLACEHOLDER_ORG/PLACEHOLDER_GITOPS_REPOSITORY.git
          targetRevision: main
          ref: values
      destination:
        server: '{{.clusterServer}}'
        namespace: '{{.platformNamespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - ApplyOutOfSyncOnly=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m

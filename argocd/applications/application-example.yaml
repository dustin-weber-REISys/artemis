# Illustrative generated Application shape. The workload ApplicationSet is the
# deployable source of truth and creates the nine concrete Applications.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: test-a-artemis-example
  namespace: PLACEHOLDER_ARGOCD_NAMESPACE
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: messaging-platform
  source:
    repoURL: https://example.invalid/PLACEHOLDER_ORG/PLACEHOLDER_GITOPS_REPOSITORY.git
    targetRevision: main
    path: charts/artemis-ha
    helm:
      valueFiles:
        - environments/test/artemis-values.yaml
      parameters:
        - name: ha.coordinationId
          value: test-a-pair
        - name: ha.groupName
          value: test-a-group
        - name: zookeeper.connectString
          value: PLACEHOLDER_SHARED_ZOOKEEPER_SERVICE.PLACEHOLDER_PLATFORM_NAMESPACE.svc.cluster.local:2181
        - name: zookeeper.serviceNamespace
          value: PLACEHOLDER_PLATFORM_NAMESPACE
        - name: zookeeper.curatorNamespace
          value: artemis/test/test-a
  destination:
    server: https://PLACEHOLDER_TEST_EKS_API_SERVER
    namespace: PLACEHOLDER_TEST_NAMESPACE_A
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        messaging.example.io/cluster: PLACEHOLDER_TEST_EKS_CLUSTER
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: artemis-workloads
  namespace: PLACEHOLDER_ARGOCD_NAMESPACE
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    # Three namespaces per cluster make nine generated Applications. The
    # namespace names are intentionally placeholders and are supplied by the
    # environment repository or cluster registration process.
    - list:
        elements:
          - environment: test
            clusterName: PLACEHOLDER_TEST_EKS_CLUSTER
            clusterServer: https://PLACEHOLDER_TEST_EKS_API_SERVER
            workloadKey: test-a
            workloadNamespace: PLACEHOLDER_TEST_NAMESPACE_A
          - environment: test
            clusterName: PLACEHOLDER_TEST_EKS_CLUSTER
            clusterServer: https://PLACEHOLDER_TEST_EKS_API_SERVER
            workloadKey: test-b
            workloadNamespace: PLACEHOLDER_TEST_NAMESPACE_B
          - environment: test
            clusterName: PLACEHOLDER_TEST_EKS_CLUSTER
            clusterServer: https://PLACEHOLDER_TEST_EKS_API_SERVER
            workloadKey: test-c
            workloadNamespace: PLACEHOLDER_TEST_NAMESPACE_C
          - environment: nonprod
            clusterName: PLACEHOLDER_NONPROD_EKS_CLUSTER
            clusterServer: https://PLACEHOLDER_NONPROD_EKS_API_SERVER
            workloadKey: nonprod-a
            workloadNamespace: PLACEHOLDER_NONPROD_NAMESPACE_A
          - environment: nonprod
            clusterName: PLACEHOLDER_NONPROD_EKS_CLUSTER
            clusterServer: https://PLACEHOLDER_NONPROD_EKS_API_SERVER
            workloadKey: nonprod-b
            workloadNamespace: PLACEHOLDER_NONPROD_NAMESPACE_B
          - environment: nonprod
            clusterName: PLACEHOLDER_NONPROD_EKS_CLUSTER
            clusterServer: https://PLACEHOLDER_NONPROD_EKS_API_SERVER
            workloadKey: nonprod-c
            workloadNamespace: PLACEHOLDER_NONPROD_NAMESPACE_C
          - environment: prod
            clusterName: PLACEHOLDER_PROD_EKS_CLUSTER
            clusterServer: https://PLACEHOLDER_PROD_EKS_API_SERVER
            workloadKey: prod-a
            workloadNamespace: PLACEHOLDER_PROD_NAMESPACE_A
          - environment: prod
            clusterName: PLACEHOLDER_PROD_EKS_CLUSTER
            clusterServer: https://PLACEHOLDER_PROD_EKS_API_SERVER
            workloadKey: prod-b
            workloadNamespace: PLACEHOLDER_PROD_NAMESPACE_B
          - environment: prod
            clusterName: PLACEHOLDER_PROD_EKS_CLUSTER
            clusterServer: https://PLACEHOLDER_PROD_EKS_API_SERVER
            workloadKey: prod-c
            workloadNamespace: PLACEHOLDER_PROD_NAMESPACE_C
  template:
    metadata:
      name: '{{.workloadKey}}-artemis'
      namespace: PLACEHOLDER_ARGOCD_NAMESPACE
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: messaging-platform
      source:
        repoURL: https://example.invalid/PLACEHOLDER_ORG/PLACEHOLDER_GITOPS_REPOSITORY.git
        targetRevision: main
        path: charts/artemis-ha
        helm:
          valueFiles:
            - environments/{{.environment}}/artemis-values.yaml
          parameters:
            - name: ha.coordinationId
              value: '{{.workloadKey}}-pair'
            - name: ha.groupName
              value: '{{.workloadKey}}-group'
            - name: zookeeper.connectString
              value: PLACEHOLDER_SHARED_ZOOKEEPER_SERVICE.PLACEHOLDER_PLATFORM_NAMESPACE.svc.cluster.local:2181
            - name: zookeeper.serviceNamespace
              value: PLACEHOLDER_PLATFORM_NAMESPACE
            # Curator namespaces are unique per HA pair even though the
            # ZooKeeper service is shared at cluster scope.
            - name: zookeeper.curatorNamespace
              value: 'artemis/{{.environment}}/{{.workloadKey}}'
      destination:
        server: '{{.clusterServer}}'
        namespace: '{{.workloadNamespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        managedNamespaceMetadata:
          labels:
            # The shared ZooKeeper NetworkPolicy admits only broker pods in
            # workload namespaces belonging to this EKS cluster.
            messaging.example.io/cluster: '{{.clusterName}}'
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - ApplyOutOfSyncOnly=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m

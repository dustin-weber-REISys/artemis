schemaVersion: validation.artemis.apache.org/load-profile-catalog/v1
kind: LoadProfileCatalog
name: replicated-validation-load
description: >-
  Declarative workload inputs and acceptance thresholds. These profiles do not
  contain an executable Kubernetes Job or run load by themselves.
defaults:
  messageCount: 100000
  payloadBytes: 256
  producerConcurrency: 1
  consumerConcurrency: 1
  durationSeconds: 900
  protocol: amqp
  persistent: true
  duplicateId: stable-per-sequence
  expectedRpo: zero-for-acknowledged
measurements:
  - sendAcknowledgementLatency
  - endToEndDeliveryLatency
  - throughputMessagesPerSecond
  - replicationConnected
  - replicationSynchronized
  - replicationLag
  - queueDepth
  - pagingBytes
  - brokerDiskUsage
  - jvmGcPause
  - clientReconnectDuration
profiles:
  - name: burst
    messageCount: 100000
    durationSeconds: 120
  - name: sustained
    messageCount: 100000
    durationSeconds: 900
  - name: two-million-capacity
    # Exercises the provisional 500-GiB PP/PR storage envelope.
    # 2,000,000 x 128 KiB is approximately 244 GiB of body data before message
    # properties, broker metadata, journal/paging overhead, and headroom.
    messageCount: 2000000
    payloadBytes: 131072
    durationSeconds: 7200
acceptance:
  missingAcknowledgedSequences: 0
  splitBrainActiveBrokers: 0
  recoveryTargetSeconds: 30

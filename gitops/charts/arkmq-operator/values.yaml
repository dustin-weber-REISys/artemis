global:
  requiredLabels:
    app: artemis
    contact: PLACEHOLDER_ARTEMIS_CONTACT
    env: PLACEHOLDER_ENVIRONMENT
    fismaid: PLACEHOLDER_ARTEMIS_FISMAID

# Immutable ArkMQ operator release and deployment policy shared by every
# environment at this Git revision. Argo CD supplies the selected ECR
# repository locations.
arkmq-org-broker-operator:
  controllerManager:
    # The operator uses controller-runtime leader election, so one pod
    # reconciles while the second remains available to take over its Lease.
    replicas: 2
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        # Prefer separate nodes without becoming unschedulable when only one
        # untainted worker is currently eligible.
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            control-plane: controller-manager
            name: activemq-artemis-operator
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        # A hard zone constraint can deadlock the standby replica during
        # node-pool maintenance or scale-up.
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            control-plane: controller-manager
            name: activemq-artemis-operator
    # The platform worker pool carries the same lifecycle taint as the broker
    # and test ZooKeeper nodes. The operator must run before it can turn an
    # ActiveMQArtemis CR into a StatefulSet and broker pods.
    tolerations:
      - key: eid-platform/node-lifecycle
        operator: Equal
        value: ondemand
        effect: NoSchedule
    manager:
      image:
        # Generated from gitops/releases/current.yaml. Environment bootstrap
        # files override only the ECR repository, never the selected tag.
        tag: 2.2.0
        pullPolicy: IfNotPresent
      relatedImages:
        # Generated from the central broker release. These tag overrides are
        # safe with the environment-specific private ECR repositories.
        activemqArtemisBrokerInit2530:
          tag: artemis.2.53.0
        activemqArtemisBrokerKubernetes2530:
          tag: artemis.2.53.0
  # Keep cluster scope, watch scope, and CRD ownership explicit so an upstream
  # default change cannot silently alter the operator's deployment contract.
  clusterScoped: true
  watchNamespaces: []
  crds:
    apply: true
    keep: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1

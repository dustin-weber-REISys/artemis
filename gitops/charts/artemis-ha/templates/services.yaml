{{- $fullname := include "artemis-ha.crName" . -}}
{{- $consolePort := include "artemis-ha.consolePort" . | int -}}
{{- range $name, $acceptor := .Values.acceptors }}
{{- if $acceptor.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-%s" $fullname $name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "artemis-ha.labels" $ | nindent 4 }}
    artemis.example.io/protocol: {{ $name }}
spec:
  type: ClusterIP
  publishNotReadyAddresses: false
  internalTrafficPolicy: {{ $.Values.services.internalTrafficPolicy }}
  selector:
    {{- include "artemis-ha.brokerSelector" $ | nindent 4 }}
  ports:
    - name: {{ $name }}
      port: {{ $acceptor.port }}
      targetPort: {{ $acceptor.port }}
      protocol: TCP
      appProtocol: {{ $name }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-console" $fullname | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "artemis-ha.labels" . | nindent 4 }}
    artemis.example.io/protocol: console
spec:
  type: ClusterIP
  publishNotReadyAddresses: false
  internalTrafficPolicy: {{ .Values.services.internalTrafficPolicy }}
  selector:
    {{- include "artemis-ha.brokerSelector" . | nindent 4 }}
  ports:
    - name: console
      port: {{ $consolePort }}
      targetPort: {{ $consolePort }}
      protocol: TCP
{{- if .Values.monitoring.enabled }}
---
# Monitoring must see the passive peer even though client Services intentionally
# use the active-only readiness gate.
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-metrics" $fullname | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "artemis-ha.labels" . | nindent 4 }}
    artemis.example.io/protocol: metrics
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  selector:
    {{- include "artemis-ha.brokerSelector" . | nindent 4 }}
  ports:
    - name: console
      port: {{ $consolePort }}
      targetPort: {{ $consolePort }}
      protocol: TCP
{{- end }}

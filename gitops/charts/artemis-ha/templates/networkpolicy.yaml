{{- if .Values.networkPolicy.enabled }}
{{- $consolePort := include "artemis-ha.consolePort" . | int -}}
{{- $brokerPeerPort := include "artemis-ha.brokerPeerPort" . | int -}}
{{- $clientPorts := list -}}
{{- range $acceptor := .Values.acceptors -}}
{{- if $acceptor.enabled -}}
{{- $clientPorts = append $clientPorts (int $acceptor.port) -}}
{{- end -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "artemis-ha.fullname" . }}-default-deny
  labels:
    {{- include "artemis-ha.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "artemis-ha.brokerSelector" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "artemis-ha.fullname" . }}-allow
  labels:
    {{- include "artemis-ha.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "artemis-ha.brokerSelector" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # The operator's internal cluster connector is separate from client
    # acceptors. Its generated headless Service supplies peer discovery.
    - from:
        - podSelector:
            matchLabels:
              {{- include "artemis-ha.brokerSelector" . | nindent 14 }}
      ports:
        - port: {{ $brokerPeerPort }}
          protocol: TCP
    {{- range .Values.networkPolicy.clientSources }}
    {{- if $clientPorts }}
    - from:
        - namespaceSelector:
            {{- toYaml .namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .podSelector | nindent 12 }}
      ports:
        {{- range $clientPorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}
    {{- end }}
    {{- range .Values.networkPolicy.managementSources }}
    - from:
        - namespaceSelector:
            {{- toYaml .namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .podSelector | nindent 12 }}
      ports:
        - port: {{ $consolePort }}
          protocol: TCP
    {{- end }}
    {{- range .Values.networkPolicy.monitoringSources }}
    - from:
        - namespaceSelector:
            {{- toYaml .namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .podSelector | nindent 12 }}
      ports:
        - port: {{ $consolePort }}
          protocol: TCP
    {{- end }}
    {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    # Kubernetes DNS is required for service discovery and the ZooKeeper
    # connect string. Namespace labels are supported on every modern EKS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              {{- include "artemis-ha.brokerSelector" . | nindent 14 }}
      ports:
        - port: {{ $brokerPeerPort }}
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.zookeeper.serviceNamespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.zookeeper.podSelector | nindent 14 }}
      ports:
        - port: {{ .Values.zookeeper.port }}
          protocol: TCP
    {{- if .Values.vault.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.vault.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.vault.podSelector | nindent 14 }}
      ports:
        - port: {{ .Values.vault.port }}
          protocol: TCP
    {{- end }}
    {{- if .Values.keycloak.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.keycloak.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.keycloak.podSelector | nindent 14 }}
      ports:
        - port: {{ .Values.keycloak.port }}
          protocol: TCP
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}

{{- $fullname := include "artemis-ha.crName" . -}}
{{- $consolePort := include "artemis-ha.consolePort" . | int -}}
{{- $externalClientCell := eq .Values.workloadCell.trafficClass "external" -}}
{{- $enabledExternalClientCell := and $externalClientCell .Values.workloadCell.enabled -}}
{{- $podAnnotations := deepCopy .Values.broker.annotations -}}
{{- $brokerLabels := mergeOverwrite (deepCopy .Values.broker.labels) .Values.commonLabels -}}
{{- $javaArgsAppend := list "-Dzookeeper.sasl.client=false" -}}
{{- if .Values.keycloak.enabled -}}
{{- $javaArgsAppend = append $javaArgsAppend (printf "-Dhawtio.oidcConfig=/amq/extra/configmaps/%s-hawtio-oidc/hawtio-oidc.properties" $fullname) -}}
{{- end -}}
{{- if .Values.vault.enabled }}
{{- $_ := set $podAnnotations "vault.hashicorp.com/agent-inject" "true" -}}
{{- $_ := set $podAnnotations "vault.hashicorp.com/agent-pre-populate-only" "true" -}}
{{- $_ := set $podAnnotations "vault.hashicorp.com/role" .Values.vault.role -}}
{{- $_ := set $podAnnotations "vault.hashicorp.com/tls-secret" .Values.vault.tlsSecretName -}}
{{- $_ := set $podAnnotations "vault.hashicorp.com/ca-cert" .Values.vault.caCertPath -}}
{{- $_ := set $podAnnotations "vault.hashicorp.com/tls-skip-verify" "false" -}}
{{- $_ := set $podAnnotations "vault.hashicorp.com/agent-inject-secret-broker-credentials" .Values.vault.secretPath -}}
{{- $_ := set $podAnnotations "vault.hashicorp.com/agent-inject-file-broker-credentials" "broker-credentials.properties" -}}
{{- $_ := set $podAnnotations "vault.hashicorp.com/agent-inject-template-broker-credentials" .Values.vault.templates.brokerCredentials -}}
{{- range $key, $value := .Values.vault.extraAnnotations }}
{{- $_ := set $podAnnotations $key $value -}}
{{- end }}
{{- end }}

{{- $brokerProperties := list
  (printf "HAPolicyConfiguration=REPLICATION_PRIMARY_LOCK_MANAGER")
  (printf "HAPolicyConfiguration.groupName=%s" .Values.ha.groupName)
  (printf "HAPolicyConfiguration.initialReplicationSyncTimeout=%d" (int .Values.ha.initialReplicationSyncTimeoutMs))
  (printf "HAPolicyConfiguration.retryReplicationWait=%d" (int .Values.ha.retryReplicationWaitMs))
  (printf "HAPolicyConfiguration.distributedManagerConfiguration.className=org.apache.activemq.artemis.lockmanager.zookeeper.CuratorDistributedLockManager")
  (printf "HAPolicyConfiguration.distributedManagerConfiguration.properties.connect-string=%s" .Values.zookeeper.connectString)
  (printf "HAPolicyConfiguration.distributedManagerConfiguration.properties.namespace=%s" .Values.zookeeper.curatorNamespace)
  (printf "HAPolicyConfiguration.distributedManagerConfiguration.properties.session-ms=%d" (int .Values.ha.zookeeperSessionTimeoutMs))
  (printf "HAPolicyConfiguration.coordinationId=%s" .Values.ha.coordinationId)
  (printf "journalSyncTransactional=%t" .Values.brokerProperties.durability.journalSyncTransactional)
  (printf "journalSyncNonTransactional=%t" .Values.brokerProperties.durability.journalSyncNonTransactional)
  (printf "journalDatasync=%t" .Values.brokerProperties.durability.journalDatasync)
  (printf "largeMessageSync=%t" .Values.brokerProperties.durability.largeMessageSync)
  (printf "globalMaxSize=%s" .Values.brokerProperties.globalMaxSize)
  (printf "maxDiskUsage=%d" (int .Values.brokerProperties.maxDiskUsage))
  (printf "connectionTTLOverride=%d" (int .Values.brokerProperties.connectionTtlOverride))
  (printf "iDCacheSize=%d" (int .Values.brokerProperties.duplicateDetectionIdCacheSize))
  (printf "persistIDCache=%t" .Values.brokerProperties.persistDuplicateDetectionIds)
  (printf "metricsConfiguration.jvmGc=true")
  (printf "metricsConfiguration.jvmMemory=true")
  (printf "metricsConfiguration.jvmThread=true")
  (printf "addressSettings.%s.maxSizeBytes=%d" .Values.brokerProperties.addressSettings.match (int .Values.brokerProperties.addressSettings.maxSizeBytes))
  (printf "addressSettings.%s.pageSizeBytes=%d" .Values.brokerProperties.addressSettings.match (int .Values.brokerProperties.addressSettings.pageSizeBytes))
  (printf "addressSettings.%s.addressFullMessagePolicy=%s" .Values.brokerProperties.addressSettings.match .Values.brokerProperties.addressSettings.addressFullPolicy)
  (printf "addressSettings.%s.maxDeliveryAttempts=%d" .Values.brokerProperties.addressSettings.match (int .Values.brokerProperties.addressSettings.maxDeliveryAttempts))
  (printf "addressSettings.%s.redeliveryDelay=%d" .Values.brokerProperties.addressSettings.match (int .Values.brokerProperties.addressSettings.redeliveryDelay))
  (printf "addressSettings.%s.deadLetterAddress=%s" .Values.brokerProperties.addressSettings.match .Values.brokerProperties.addressSettings.deadLetterAddress)
  (printf "addressSettings.%s.autoCreateDeadLetterResources=%t" .Values.brokerProperties.addressSettings.match .Values.brokerProperties.addressSettings.autoCreateDeadLetterResources)
  (printf "addressSettings.%s.deadLetterQueuePrefix=%s" .Values.brokerProperties.addressSettings.match .Values.brokerProperties.addressSettings.deadLetterQueuePrefix)
  (printf "addressSettings.%s.deadLetterQueueSuffix=%s" .Values.brokerProperties.addressSettings.match .Values.brokerProperties.addressSettings.deadLetterQueueSuffix)
  (printf "addressSettings.%s.autoDeleteQueues=%t" .Values.brokerProperties.addressSettings.match .Values.brokerProperties.addressSettings.autoDeleteQueues)
  (printf "addressSettings.%s.autoDeleteAddresses=%t" .Values.brokerProperties.addressSettings.match .Values.brokerProperties.addressSettings.autoDeleteAddresses)
  (printf "addressSettings.%s.autoCreateQueues=%t" .Values.brokerProperties.addressSettings.match .Values.brokerProperties.addressSettings.autoCreateQueues)
  (printf "addressSettings.%s.autoCreateAddresses=%t" .Values.brokerProperties.addressSettings.match .Values.brokerProperties.addressSettings.autoCreateAddresses)
  (printf "addressSettings.%s.defaultAddressRoutingType=%s" .Values.brokerProperties.addressSettings.match .Values.brokerProperties.addressSettings.defaultAddressRoutingType)
  (printf "addressSettings.%s.defaultQueueRoutingType=%s" .Values.brokerProperties.addressSettings.match .Values.brokerProperties.addressSettings.defaultQueueRoutingType)
}}
{{- if .Values.brokerProperties.addressSettings.expiry.enabled }}
{{- $brokerProperties = append $brokerProperties (printf "addressSettings.%s.expiryAddress=%s" .Values.brokerProperties.addressSettings.match .Values.brokerProperties.addressSettings.expiry.address) }}
{{- $brokerProperties = append $brokerProperties (printf "addressSettings.%s.autoCreateExpiryResources=%t" .Values.brokerProperties.addressSettings.match .Values.brokerProperties.addressSettings.expiry.autoCreateResources) }}
{{- $brokerProperties = append $brokerProperties (printf "addressSettings.%s.expiryQueuePrefix=%s" .Values.brokerProperties.addressSettings.match .Values.brokerProperties.addressSettings.expiry.queuePrefix) }}
{{- $brokerProperties = append $brokerProperties (printf "addressSettings.%s.expiryQueueSuffix=%s" .Values.brokerProperties.addressSettings.match .Values.brokerProperties.addressSettings.expiry.queueSuffix) }}
{{- end }}
{{- $seenAddresses := dict }}
{{- $seenQueues := dict }}
{{- range $destination := .Values.destinations }}
{{- if hasKey $seenAddresses $destination.address }}
{{- fail (printf "destinations contains duplicate address %q" $destination.address) }}
{{- end }}
{{- $_ := set $seenAddresses $destination.address true }}
{{- $addressKey := printf "\"%s\"" $destination.address }}
{{- $brokerProperties = append $brokerProperties (printf "addressConfigurations.%s.routingTypes=%s" $addressKey (join "," $destination.routingTypes)) }}
{{- range $queue := $destination.queues }}
{{- if hasKey $seenQueues $queue.name }}
{{- fail (printf "destinations contains duplicate queue %q" $queue.name) }}
{{- end }}
{{- if not (has $queue.routingType $destination.routingTypes) }}
{{- fail (printf "queue %q routingType %s is not enabled on address %q" $queue.name $queue.routingType $destination.address) }}
{{- end }}
{{- $_ := set $seenQueues $queue.name true }}
{{- $queueKey := printf "\"%s\"" $queue.name }}
{{- $queuePrefix := printf "addressConfigurations.%s.queueConfigs.%s" $addressKey $queueKey }}
{{- $brokerProperties = append $brokerProperties (printf "%s.address=%s" $queuePrefix $destination.address) }}
{{- $brokerProperties = append $brokerProperties (printf "%s.routingType=%s" $queuePrefix $queue.routingType) }}
{{- $brokerProperties = append $brokerProperties (printf "%s.durable=%t" $queuePrefix $queue.durable) }}
{{- $brokerProperties = append $brokerProperties (printf "%s.maxConsumers=%d" $queuePrefix (int $queue.maxConsumers)) }}
{{- $brokerProperties = append $brokerProperties (printf "%s.purgeOnNoConsumers=%t" $queuePrefix $queue.purgeOnNoConsumers) }}
{{- end }}
{{- end }}
{{- range $rule := .Values.authorization.rules }}
{{- $escapedMatch := replace ":" "\\:" $rule.match }}
{{- range $operation, $roles := $rule.permissions }}
{{- range $role := $roles }}
{{- $brokerProperties = append $brokerProperties (printf "securityRoles.\"%s\".%s.%s=true" $escapedMatch $role $operation) }}
{{- end }}
{{- end }}
{{- end }}
{{- $peerAcceptor := index .Values.acceptors "artemis" }}
{{- if or (empty $peerAcceptor) (not $peerAcceptor.enabled) (ne (int $peerAcceptor.port) 61616) (not (has "CORE" (splitList "," $peerAcceptor.protocols))) }}
{{- fail "acceptors.artemis must remain enabled on port 61616 and include the CORE protocol for operator-managed peer traffic" }}
{{- end }}
{{- $seenAcceptorPorts := dict }}
{{- $mtlsAcceptors := list }}
{{- range $acceptorName, $acceptor := .Values.acceptors }}
{{- if $acceptor.enabled }}
{{- $portKey := printf "%d" (int $acceptor.port) }}
{{- if hasKey $seenAcceptorPorts $portKey }}
{{- fail (printf "enabled acceptors %s and %s cannot share port %s" (index $seenAcceptorPorts $portKey) $acceptorName $portKey) }}
{{- end }}
{{- $_ := set $seenAcceptorPorts $portKey $acceptorName }}
{{- if and $acceptor.sslEnabled (empty $acceptor.sslSecret) }}
{{- fail (printf "acceptors.%s.sslSecret is required when TLS is enabled" $acceptorName) }}
{{- end }}
{{- if and (not $acceptor.sslEnabled) (or $acceptor.needClientAuth (not (empty $acceptor.sslSecret)) (not (empty $acceptor.trustSecret))) }}
{{- fail (printf "acceptors.%s needClientAuth/sslSecret/trustSecret require sslEnabled=true" $acceptorName) }}
{{- end }}
{{- if and $acceptor.needClientAuth (not $externalClientCell) }}
{{- fail (printf "acceptors.%s needClientAuth is reserved for external Workload Cells" $acceptorName) }}
{{- end }}
{{- if and $acceptor.sslEnabled $acceptor.needClientAuth }}
{{- $mtlsAcceptors = append $mtlsAcceptors $acceptorName }}
{{- end }}
{{- if and $enabledExternalClientCell (ne $acceptorName "artemis") (or (not $acceptor.sslEnabled) (not $acceptor.needClientAuth)) }}
{{- fail (printf "enabled external Workload Cells require acceptors.%s to use mTLS or be disabled" $acceptorName) }}
{{- end }}
{{- if and $acceptor.supportAdvisory (not (has "OPENWIRE" (splitList "," $acceptor.protocols))) }}
{{- fail (printf "acceptors.%s supportAdvisory requires the OPENWIRE protocol" $acceptorName) }}
{{- end }}
{{- range $key, $value := $acceptor.extraParams }}
{{- $brokerProperties = append $brokerProperties (printf "acceptorConfigurations.%s.extraParams.%s=%s" $acceptorName $key $value) }}
{{- end }}
{{- end }}
{{- end }}
{{- range .Values.brokerProperties.extra }}
{{- $extraKey := regexFind "^[^=]+" . | lower }}
{{- $normalizedExtraKey := regexReplaceAll "[-_.[:space:]]" $extraKey "" }}
{{- if regexMatch "^(hapolicyconfiguration|journalsynctransactional$|journalsyncnontransactional$|journaldatasync$|largemessagesync$|persistenceenabled$|journaltype$|clusterconfigurations|brokerconnections|addressconfigurations|securityroles|idcachesize$|persistidcache$)" $normalizedExtraKey }}
{{- fail (printf "brokerProperties.extra cannot override protected HA, durability, destination, or authorization property %q" $extraKey) }}
{{- end }}
{{- $brokerProperties = append $brokerProperties . }}
{{- end }}

{{- if empty .Values.ha.coordinationId }}
{{- fail "ha.coordinationId is required and must be unique per HA pair" }}
{{- end }}
{{- if empty .Values.zookeeper.connectString }}
{{- fail "zookeeper.connectString is required and must identify the external ensemble" }}
{{- end }}
{{- if and (not (empty .Values.authentication.jaasSecretName)) (not (hasSuffix "-jaas-config" .Values.authentication.jaasSecretName)) }}
{{- fail "authentication.jaasSecretName must end in -jaas-config" }}
{{- end }}
{{- if and $enabledExternalClientCell (empty .Values.authentication.jaasSecretName) }}
{{- fail "authentication.jaasSecretName is required when an external Workload Cell is enabled" }}
{{- end }}
{{- if and (not $externalClientCell) (not (empty .Values.authentication.jaasSecretName)) }}
{{- fail "authentication.jaasSecretName is reserved for external Workload Cells" }}
{{- end }}
{{- if and (not $externalClientCell) (not (empty .Values.authorization.rules)) }}
{{- fail "authorization.rules are reserved for external Workload Cells" }}
{{- end }}
{{- if and $enabledExternalClientCell (empty .Values.authorization.rules) }}
{{- fail "authorization.rules are required when an external Workload Cell is enabled" }}
{{- end }}
{{- if and $enabledExternalClientCell (eq (len $mtlsAcceptors) 0) }}
{{- fail "an enabled external Workload Cell requires at least one enabled TLS acceptor with needClientAuth=true" }}
{{- end }}
{{- if and $enabledExternalClientCell (or (not (empty .Values.networkPolicy.clientSources)) (not (empty .Values.networkPolicy.clientCidrs))) }}
{{- fail "external Workload Cells require per-listener network sources; clientSources and clientCidrs grant every enabled acceptor" }}
{{- end }}
apiVersion: broker.amq.io/v1beta1
kind: ActiveMQArtemis
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "artemis-ha.labels" . | nindent 4 }}
spec:
  version: {{ .Values.broker.version | quote }}
  adminUser: {{ .Values.broker.adminUser | quote }}
  # deploymentPlan.labels applies to the broker pod template. An unscoped
  # resourceTemplate applies the enterprise labels to every supporting object
  # generated by the operator, including the StatefulSet metadata evaluated by
  # admission policy.
  resourceTemplates:
    - labels:
        {{- toYaml .Values.commonLabels | nindent 8 }}
  brokerProperties:
    {{- toYaml $brokerProperties | nindent 4 }}
  env:
    - name: APPLICATION_NAME
      value: $(CR_NAME)
    - name: PING_SVC_NAME
      value: ping-svc
    # This ZooKeeper deployment does not configure SASL. The Java client
    # otherwise attempts it by default and emits a misleading AuthFailed event
    # before continuing with the unauthenticated connection.
    - name: JAVA_ARGS_APPEND
      value: {{ join " " $javaArgsAppend | quote }}
    {{- with .Values.keycloak.extraEnv }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  deploymentPlan:
    # Internal and batch Workload Cells rely on network admission. External
    # Workload Cells require broker login and an mTLS acceptor before enablement.
    size: 2
    requireLogin: {{ $externalClientCell }}
    persistenceEnabled: true
    journalType: {{ .Values.persistence.journalType | quote }}
    messageMigration: false
    clustered: true
    resources:
      {{- toYaml .Values.broker.resources | nindent 6 }}
    storage:
      size: {{ .Values.persistence.size | quote }}
      storageClassName: {{ .Values.persistence.storageClassName | quote }}
    topologySpreadConstraints:
      {{- range .Values.topology.topologySpreadConstraints }}
      - maxSkew: {{ .maxSkew }}
        minDomains: {{ .minDomains }}
        topologyKey: {{ .topologyKey | quote }}
        whenUnsatisfiable: {{ .whenUnsatisfiable }}
        labelSelector:
          matchLabels:
            ActiveMQArtemis: {{ $fullname }}
      {{- end }}
    jolokiaAgentEnabled: true
    managementRBACEnabled: true
    podSecurity:
      serviceAccountName: {{ include "artemis-ha.serviceAccountName" . }}
      runAsUser: 1000
    podSecurityContext:
      {{- toYaml .Values.security.podSecurityContext | nindent 6 }}
    containerSecurityContext:
      {{- toYaml .Values.security.containerSecurityContext | nindent 6 }}
    extraVolumes:
      {{- range .Values.security.writableVolumes }}
      - name: {{ .name }}
        emptyDir: {}
      {{- end }}
    extraVolumeMounts:
      {{- range .Values.security.writableVolumes }}
      - name: {{ .name }}
        mountPath: {{ .mountPath }}
      {{- end }}
    {{- if or .Values.keycloak.enabled (not (empty .Values.authentication.jaasSecretName)) }}
    extraMounts:
      {{- if .Values.keycloak.enabled }}
      configMaps:
        - {{ $fullname }}-hawtio-oidc
      {{- end }}
      {{- if not (empty .Values.authentication.jaasSecretName) }}
      secrets:
        - {{ .Values.authentication.jaasSecretName | quote }}
      {{- end }}
    {{- end }}
    startupProbe:
      tcpSocket:
        port: {{ $consolePort }}
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30
    livenessProbe:
      tcpSocket:
        port: {{ $consolePort }}
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 6
    # The image owns the broker MBean name (commonly "amq-broker"); it does
    # not necessarily match the operator's Kubernetes application name. Both
    # active and standby brokers are ready when Jolokia can report their role.
    readinessProbe:
      exec:
        command:
          - /bin/bash
          - -ec
          - >-
            response="$(curl -fsS --max-time 5 -H "Origin: http://localhost"
            -u "$AMQ_USER:$AMQ_PASSWORD"
            "http://$HOSTNAME:{{ $consolePort }}/console/jolokia/read/org.apache.activemq.artemis:broker=*/Active")"
            && grep -Eq '"Active"[[:space:]]*:[[:space:]]*(true|false)' <<<"$response"
            && grep -Eq '"status"[[:space:]]*:[[:space:]]*200' <<<"$response"
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 8
      failureThreshold: 3
    enableMetricsPlugin: true
    tolerations:
      {{- toYaml .Values.broker.tolerations | nindent 6 }}
    nodeSelector:
      {{- toYaml .Values.broker.nodeSelector | nindent 6 }}
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          {{- range .Values.topology.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution }}
          - topologyKey: {{ .topologyKey | quote }}
            labelSelector:
              matchLabels:
                ActiveMQArtemis: {{ $fullname }}
          {{- end }}
    labels:
      {{- toYaml $brokerLabels | nindent 6 }}
    annotations:
      {{- toYaml $podAnnotations | nindent 6 }}
    podDisruptionBudget:
      maxUnavailable: {{ .Values.topology.pdb.maxUnavailable }}
    revisionHistoryLimit: {{ .Values.broker.revisionHistoryLimit }}
  console:
    expose: false
  acceptors:
    {{- range $name, $acceptor := .Values.acceptors }}
    {{- if $acceptor.enabled }}
    - name: {{ $name }}
      port: {{ $acceptor.port }}
      protocols: {{ $acceptor.protocols | quote }}
      bindToAllInterfaces: {{ $acceptor.bindToAllInterfaces }}
      supportAdvisory: {{ $acceptor.supportAdvisory }}
      suppressInternalManagementObjects: {{ $acceptor.suppressInternalManagementObjects }}
      sslEnabled: {{ $acceptor.sslEnabled }}
      {{- if $acceptor.sslEnabled }}
      needClientAuth: {{ $acceptor.needClientAuth }}
      sslSecret: {{ $acceptor.sslSecret | quote }}
      {{- if not (empty $acceptor.trustSecret) }}
      trustSecret: {{ $acceptor.trustSecret | quote }}
      {{- end }}
      {{- end }}
      connectionsAllowed: {{ $acceptor.connectionsAllowed }}
    {{- end }}
    {{- end }}

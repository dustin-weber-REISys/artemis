# This file is intentionally generic. Environment overlays must provide the
# external ZooKeeper connection string and a pair-unique coordination ID.

# Required enterprise resource labels. Replace the ownership and system ID
# placeholders during environment import; keep env aligned with the overlay.
commonLabels:
  app: artemis
  contact: PLACEHOLDER_ARTEMIS_CONTACT
  env: PLACEHOLDER_ENVIRONMENT
  fismaid: PLACEHOLDER_ARTEMIS_FISMAID

ha:
  coordinationId: examplepair01
  groupName: artemis-ha-pair
  initialReplicationSyncTimeoutMs: 30000
  retryReplicationWaitMs: 2000
  zookeeperSessionTimeoutMs: 18000

zookeeper:
  # The chart consumes, but does not create, the external ensemble.
  connectString: example-zookeeper-client.example-platform.svc.cluster.local:2181
  serviceNamespace: example-platform
  # Curator namespace is a ZooKeeper path and must be unique per HA pair.
  curatorNamespace: artemis/example/example-pair
  podSelector:
    app.kubernetes.io/name: zookeeper
  port: 2181

persistence:
  size: 20Gi
  storageClassName: gp3
  journalType: NIO

broker:
  version: 2.53.0
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi
  revisionHistoryLimit: 10
  nodeSelector: {}
  tolerations: []
  labels: {}
  annotations: {}

security:
  serviceAccount:
    create: true
    name: ""
    automountServiceAccountToken: false
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  # These mounts are required by the upstream operator/image read-only-root
  # pattern. They are emptyDir volumes, not configuration or secret stores.
  writableVolumes:
    - name: jboss-home
      mountPath: /home/jboss
    - name: jolokia-config
      mountPath: /opt/jboss/container/jolokia/etc
    - name: tmp-dir
      mountPath: /tmp

acceptors:
  openwire:
    enabled: true
    port: 61616
    protocols: OPENWIRE
    connectionsAllowed: 10000
    sslEnabled: false
    extraParams: {}
  amqp:
    enabled: true
    port: 5672
    protocols: AMQP
    connectionsAllowed: 10000
    sslEnabled: false
    extraParams: {}
  stomp:
    enabled: true
    port: 61613
    protocols: STOMP
    connectionsAllowed: 10000
    sslEnabled: false
    extraParams: {}
  mqtt:
    enabled: true
    port: 1883
    protocols: MQTT
    connectionsAllowed: 10000
    sslEnabled: false
    extraParams: {}
  websocket:
    enabled: true
    port: 61614
    protocols: STOMP
    connectionsAllowed: 10000
    sslEnabled: false
    extraParams:
      httpEnabled: "true"

console:
  ingress:
    enabled: true
    className: aws-lb-ingress
    host: artemis.example.invalid
    # Match the platform's shared-standard-group pattern. HTTPS certificates,
    # scheme, subnets, and security groups are owned by the shared ALB and its
    # IngressClass rather than by each Artemis workload.
    annotations:
      alb.ingress.kubernetes.io/backend-protocol: HTTP
      alb.ingress.kubernetes.io/group.name: shared-standard-group
      alb.ingress.kubernetes.io/group.order: "100"
      alb.ingress.kubernetes.io/healthcheck-path: /
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
      alb.ingress.kubernetes.io/success-codes: 200-401
      alb.ingress.kubernetes.io/target-type: ip

keycloak:
  enabled: true
  displayName: Example Keycloak
  issuerUrl: https://keycloak.example.invalid/realms/example
  clientId: example-artemis-console
  scopes: openid profile email
  redirectUri: https://artemis.example.invalid/console
  rolesPath: realm_access.roles
  viewerRole: messaging-viewer
  administratorRole: messaging-admin
  namespace: example-platform
  podSelector:
    app.kubernetes.io/name: keycloak
  port: 8443
  extraEnv: []

vault:
  # Injection is opt-in because the chart does not yet connect this file to
  # the broker's effective administrative identity. Enable it only with the
  # approved Vault-to-Artemis bridge described in the import guide.
  enabled: false
  role: example-messaging
  tlsSecretName: example-vault-tls
  caCertPath: /vault/tls/ca.crt
  secretPath: kubernetes/example/example-messaging
  namespace: example-platform
  podSelector:
    app.kubernetes.io/name: vault
  port: 8200
  templates:
    brokerCredentials: |
      {{- with secret "kubernetes/example/example-messaging" -}}
      username={{ .Data.data.username }}
      password={{ .Data.data.password }}
      {{- end }}
  extraAnnotations: {}

brokerProperties:
  # These are safety invariants, not tunable performance defaults. Keeping
  # them explicit makes the acknowledged-send durability boundary auditable
  # across broker upgrades.
  durability:
    journalSyncTransactional: true
    journalSyncNonTransactional: true
    journalDatasync: true
    largeMessageSync: true
  globalMaxSize: 512Mi
  maxDiskUsage: 90
  connectionTtlOverride: 60000
  duplicateDetectionIdCacheSize: 20000
  persistDuplicateDetectionIds: true
  addressSettings:
    match: "#"
    maxSizeBytes: 104857600
    pageSizeBytes: 10485760
    addressFullPolicy: PAGE
    # Route to the DLQ after the initial unsuccessful delivery; do not retry.
    maxDeliveryAttempts: 1
    redeliveryDelay: 0
    # Undeliverable messages share an internal dead-letter address while
    # Artemis creates one filtered DLQ.<source-address> queue per source.
    deadLetterAddress: DLA
    autoCreateDeadLetterResources: true
    deadLetterQueuePrefix: "DLQ."
    deadLetterQueueSuffix: ""
    # Retain broker-created DLQ resources for operational triage.
    autoDeleteQueues: false
    autoDeleteAddresses: false
    # Message expiry is disabled by default. Enabling this one switch renders
    # the complete per-source EXP.<address> configuration below.
    expiry:
      enabled: false
      address: ExpiryQueue
      autoCreateResources: true
      queuePrefix: "EXP."
      queueSuffix: ""
    # Permanent application queues remain declarative in promoted environments.
    autoCreateQueues: false
    autoCreateAddresses: false
    defaultAddressRoutingType: ANYCAST
    defaultQueueRoutingType: ANYCAST
  extra: []

topology:
  topologySpreadConstraints:
    - maxSkew: 1
      minDomains: 2
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
    - maxSkew: 1
      minDomains: 2
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: topology.kubernetes.io/zone
      - topologyKey: kubernetes.io/hostname
  pdb:
    maxUnavailable: 1

services:
  internalTrafficPolicy: Cluster

networkPolicy:
  enabled: true
  # A list of namespace/pod selector pairs is required for application access.
  # Empty defaults keep this chart deny-by-default until an environment adds
  # its approved callers.
  clientSources: []
  # ALB traffic does not originate from an in-cluster ingress-controller pod.
  # Environments must allow their approved ALB/VPC sources on the console port
  # with extraIngress (or an equivalent platform-owned policy).
  managementSources: []
  monitoringSources:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: example-monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
  extraIngress: []
  extraEgress: []

monitoring:
  enabled: true
  pendingMessagesWarningThreshold: 10000
  # The metrics Service exposes both peers. Environments may supply metric
  # names after adding JMX exporter rules for the Active/ReplicaSync attrs.
  activeMetricName: ""
  replicationSynchronizedMetricName: ""
  extraRules: []
  serviceMonitor:
    enabled: true
    namespace: ""
    labels: {}
    interval: 30s
    scrapeTimeout: 10s
    path: /metrics
    port: console
  prometheusRule:
    enabled: true
    namespace: ""
    labels: {}
    severity: warning

acceptors:
  partner-openwire:
    enabled: true
    port: 61617
    protocols: OPENWIRE
    connectionsAllowed: 5000
    bindToAllInterfaces: true
    supportAdvisory: true
    suppressInternalManagementObjects: false
    sslEnabled: true
    needClientAuth: true
    sslSecret: partner-broker-tls
    trustSecret: ""
    extraParams:
      openWireDestinationCacheSize: "1024"
      securityDomain: partner-certificates
  partner-stomp:
    enabled: true
    port: 61612
    protocols: STOMP
    connectionsAllowed: 100
    bindToAllInterfaces: true
    supportAdvisory: false
    suppressInternalManagementObjects: true
    sslEnabled: true
    needClientAuth: true
    sslSecret: partner-broker-tls
    trustSecret: ""
    extraParams:
      securityDomain: partner-certificates

authentication:
  jaasSecretName: partner-clients-jaas-config

destinations:
  partner-request:
    address: PARTNER.REQUEST
    routingTypes:
      - ANYCAST
    queues:
      - name: PARTNER.REQUEST
        routingType: ANYCAST
        durable: true
        maxConsumers: -1
        purgeOnNoConsumers: false
  partner-response:
    address: PARTNER.RESPONSE
    routingTypes:
      - ANYCAST
    queues:
      - name: PARTNER.RESPONSE
        routingType: ANYCAST
        durable: true
        maxConsumers: 20
        purgeOnNoConsumers: false
  partner-events:
    address: PARTNER.EVENTS
    routingTypes:
      - MULTICAST
    queues: []

authorization:
  rules:
    partner-request:
      match: PARTNER.REQUEST
      permissions:
        send:
          - partner-client
        browse:
          - messaging-admin
        consume:
          - messaging-admin
    partner-response-queue:
      match: PARTNER.RESPONSE::PARTNER.RESPONSE
      permissions:
        consume:
          - partner-client
        browse:
          - partner-client
        send:
          - messaging-admin
    partner-advisories:
      match: ActiveMQ.Advisory.#
      permissions:
        consume:
          - partner-client
        browse:
          - partner-client
    partner-management:
      match: mops.#
      permissions:
        view:
          - messaging-viewer
          - messaging-admin
        edit:
          - messaging-admin
    partner-admin:
      match: PARTNER.#
      permissions:
        createAddress:
          - messaging-admin
        deleteAddress:
          - messaging-admin
        createDurableQueue:
          - messaging-admin
        deleteDurableQueue:
          - messaging-admin

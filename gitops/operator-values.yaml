# Immutable ArkMQ operator release shared by every environment at this Git
# revision. Argo CD supplies the selected ECR repository locations.
arkmq-org-broker-operator:
  controllerManager:
    # The operator uses controller-runtime leader election, so one pod
    # reconciles while the second remains available to take over its Lease.
    replicas: 2
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        # The operator should prefer separate nodes without becoming
        # unschedulable when only one untainted worker is currently eligible.
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            control-plane: controller-manager
            name: activemq-artemis-operator
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        # Preserve zone spreading as a preference. A hard constraint can
        # deadlock the standby replica during node-pool maintenance or scale-up.
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            control-plane: controller-manager
            name: activemq-artemis-operator
    # The platform worker pool carries the same lifecycle taint as the broker
    # and test ZooKeeper nodes. The operator must be schedulable before it can
    # turn an ActiveMQArtemis CR into a StatefulSet and broker pods.
    tolerations:
      - key: eid-platform/node-lifecycle
        operator: Equal
        value: ondemand
        effect: NoSchedule
    manager:
      image:
        tag: 2.2.0@sha256:ab922b10ed90483cd4ec67d978d618b743b62ef5daba6fe97c7e10a72936302f
        pullPolicy: IfNotPresent
  clusterScoped: true
  watchNamespaces: []
  crds:
    apply: true
    keep: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1

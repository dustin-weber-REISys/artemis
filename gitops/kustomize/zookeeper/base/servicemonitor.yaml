apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: shared-zookeeper-zookeeper
  labels:
    release: PLACEHOLDER_PROMETHEUS_RELEASE
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: zookeeper
      zookeeper.example.io/service: headless
  namespaceSelector:
    matchNames:
      - artemis-platform
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: true

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: artemis-platform

resources:
  - serviceaccount.yaml
  - services.yaml
  - statefulset.yaml
  - networkpolicy.yaml
  - pdb.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml

configMapGenerator:
  - name: shared-zookeeper-zookeeper-config
    files:
      - zoo.cfg

labels:
  - pairs:
      app: artemis
      contact: PLACEHOLDER_ARTEMIS_CONTACT
      fismaid: PLACEHOLDER_ARTEMIS_FISMAID
      app.kubernetes.io/name: zookeeper
      app.kubernetes.io/version: 3.9.5
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
    # Pod and PVC templates need different ownership histories. The pod labels
    # are explicit in the StatefulSet; the immutable PVC template preserves the
    # former Helm labels so the first Kustomize sync is an in-place update.
    includeTemplates: false

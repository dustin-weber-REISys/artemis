apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shared-zookeeper-zookeeper
spec:
  template:
    spec:
      # Test retains historical EBS volumes that are not guaranteed to be
      # distributed one per availability zone. Prefer three-zone placement,
      # but do not deadlock a rollout when an ordinal must return to its
      # volume's existing zone. Host anti-affinity remains required.
      topologySpreadConstraints:
        - maxSkew: 1
          # minDomains is valid only with DoNotSchedule. Explicit null removes
          # the base field during the strategic merge for ScheduleAnyway.
          minDomains: null
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: zookeeper
      tolerations:
        - key: eid-platform/node-lifecycle
          operator: Equal
          value: ondemand
          effect: NoSchedule
      initContainers:
        - name: wait-for-peer-dns
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: 500m
              memory: 1Gi
      containers:
        - name: zookeeper
          env:
            - name: JVMFLAGS
              value: -Xms256m -Xmx512m
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: 500m
              memory: 1Gi

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmGlobals:
  chartHome: charts

helmCharts:
  - name: arkmq-org-broker-operator
    repo: oci://quay.io/arkmq-org/helm-charts
    version: 2.2.0
    releaseName: arkmq-operator
    namespace: artemis-platform
    valuesFile: values.yaml
    includeCRDs: true

resources:
  - pdb.yaml

labels:
  - pairs:
      app: artemis
      contact: PLACEHOLDER_ARTEMIS_CONTACT
      fismaid: PLACEHOLDER_ARTEMIS_FISMAID
    includeSelectors: false
    includeTemplates: true

patches:
  # CRDs are upgraded deliberately with the controller but are never pruned or
  # deleted merely because an Application or chart revision stops emitting
  # them. Removal requires a separate, reviewed retirement operation.
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-options
        value: Prune=false,Delete=false
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: activemq-artemis-controller-manager
    path: deployment-identity.patch.yaml

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmGlobals:
  chartHome: charts

helmCharts:
  - name: arkmq-org-broker-operator
    repo: oci://quay.io/arkmq-org/helm-charts
    version: 2.2.0
    releaseName: arkmq-operator
    namespace: PLACEHOLDER_PLATFORM_NAMESPACE
    valuesFile: values.yaml
    includeCRDs: true

resources:
  - pdb.yaml

labels:
  - pairs:
      app: artemis
      contact: PLACEHOLDER_ARTEMIS_CONTACT
      fismaid: PLACEHOLDER_ARTEMIS_FISMAID
    includeSelectors: false
    includeTemplates: true

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: activemq-artemis-controller-manager
    path: deployment-identity.patch.yaml

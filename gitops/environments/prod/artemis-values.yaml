# Production keeps the promotion topology and tested artifact references;
# final capacity is confirmed from nonprod load results.
images:
  broker:
    repository: example.invalid/ecr-mirror/activemq-artemis-broker-kubernetes
  init:
    repository: example.invalid/ecr-mirror/activemq-artemis-broker-init
broker:
  resources:
    requests:
      cpu: "1"
      memory: 4Gi
    limits:
      cpu: "2"
      memory: 6Gi
persistence:
  storageClassName: PLACEHOLDER_PROD_GP3_STORAGE_CLASS
brokerProperties:
  # Preserve operating headroom and block producers before the dedicated
  # broker volume approaches exhaustion.
  maxDiskUsage: 80

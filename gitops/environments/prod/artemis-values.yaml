# Cluster integrations and optional cluster-wide messaging baselines for
# production. Pair-owned policy, sizing, Profile behavior, and release versions
# are owned elsewhere.
commonLabels:
  env: prod

broker:
  # Environment worker nodes carry the platform's on-demand lifecycle taint.
  # Admit brokers only to that lifecycle class; do not use a blanket Exists
  # toleration because it would also admit unrelated protected node pools.
  tolerations:
    - key: eid-platform/node-lifecycle
      operator: Equal
      value: ondemand
      effect: NoSchedule
persistence:
  storageClassName: PLACEHOLDER_PROD_GP3_STORAGE_CLASS
keycloak:
  # Reuse the existing production legacy Hawtio client and realm for every
  # production broker namespace. Redirect URIs remain pair-specific.
  enabled: true
  displayName: Legacy Hawtio Production
  issuerUrl: https://keycloak-prod.example.invalid/realms/PLACEHOLDER_LEGACY_HAWTIO_REALM
  clientId: PLACEHOLDER_PROD_LEGACY_HAWTIO_CLIENT_ID
  scopes: openid profile email
  rolesPath: realm_access.roles
  viewerRole: PLACEHOLDER_LEGACY_HAWTIO_VIEWER_ROLE
  administratorRole: PLACEHOLDER_LEGACY_HAWTIO_ADMINISTRATOR_ROLE
  namespace: PLACEHOLDER_PROD_KEYCLOAK_NAMESPACE
  podSelector:
    app.kubernetes.io/name: keycloak
  port: 8443

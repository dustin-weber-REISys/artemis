# Cluster integrations for the test cluster. Workload Cell identity, sizing,
# Profile behavior, and release versions are owned elsewhere.
commonLabels:
  env: test

broker:
  # Environment worker nodes carry the platform's on-demand lifecycle taint.
  # Admit brokers only to that lifecycle class; do not use a blanket Exists
  # toleration because it would also admit unrelated protected node pools.
  tolerations:
    - key: eid-platform/node-lifecycle
      operator: Equal
      value: ondemand
      effect: NoSchedule
persistence:
  storageClassName: PLACEHOLDER_TEST_GP3_STORAGE_CLASS

# Reuse the existing legacy Hawtio client in preprod Keycloak. The
# ApplicationSet supplies the exact console redirect URI for each Workload Cell.
keycloak:
  enabled: true
  displayName: Legacy Hawtio Preprod
  issuerUrl: https://keycloak-preprod.example.invalid/realms/PLACEHOLDER_LEGACY_HAWTIO_REALM
  clientId: PLACEHOLDER_PREPROD_LEGACY_HAWTIO_CLIENT_ID
  scopes: openid profile email
  rolesPath: realm_access.roles
  viewerRole: PLACEHOLDER_LEGACY_HAWTIO_VIEWER_ROLE
  administratorRole: PLACEHOLDER_LEGACY_HAWTIO_ADMINISTRATOR_ROLE
  namespace: PLACEHOLDER_PREPROD_KEYCLOAK_NAMESPACE
  podSelector:
    app.kubernetes.io/name: keycloak
  port: 8443

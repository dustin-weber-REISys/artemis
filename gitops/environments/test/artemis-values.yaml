# Generic workload overlay consumed by the Artemis HA chart. The test
# cluster's local ApplicationSet supplies namespace, coordination ID, and
# shared-ZooKeeper service parameters per generated Application.
images:
  broker:
    repository: PLACEHOLDER_NONPROD_ECR_REGISTRY/PLACEHOLDER_NONPROD_ECR_REPOSITORY/activemq-artemis-broker-kubernetes
  init:
    repository: PLACEHOLDER_NONPROD_ECR_REGISTRY/PLACEHOLDER_NONPROD_ECR_REPOSITORY/activemq-artemis-broker-init
broker:
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "1"
      memory: 3Gi
persistence:
  storageClassName: PLACEHOLDER_TEST_GP3_STORAGE_CLASS

# Reuse the existing legacy Hawtio client in preprod Keycloak. The
# ApplicationSet supplies the exact console redirect URI for each broker pair.
keycloak:
  enabled: true
  displayName: Legacy Hawtio Preprod
  issuerUrl: https://keycloak-preprod.example.invalid/realms/PLACEHOLDER_LEGACY_HAWTIO_REALM
  clientId: PLACEHOLDER_PREPROD_LEGACY_HAWTIO_CLIENT_ID
  scopes: openid profile email
  rolesPath: realm_access.roles
  viewerRole: PLACEHOLDER_LEGACY_HAWTIO_VIEWER_ROLE
  administratorRole: PLACEHOLDER_LEGACY_HAWTIO_ADMINISTRATOR_ROLE
  namespace: PLACEHOLDER_PREPROD_KEYCLOAK_NAMESPACE
  podSelector:
    app.kubernetes.io/name: keycloak
  port: 8443

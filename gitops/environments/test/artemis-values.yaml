# Generic workload overlay consumed by the Artemis HA chart. The
# ApplicationSet supplies namespace, coordination ID, and shared-ZooKeeper
# service parameters per generated Application.
images:
  broker:
    repository: example.invalid/ecr-mirror/activemq-artemis-broker-kubernetes
  init:
    repository: example.invalid/ecr-mirror/activemq-artemis-broker-init
broker:
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "1"
      memory: 3Gi
persistence:
  storageClassName: gp3
  size: 20Gi
console:
  ingress:
    host: artemis-test.example.invalid
keycloak:
  redirectUri: https://artemis-test.example.invalid/console

# Generic workload overlay consumed by the Artemis HA chart. The test
# cluster's local ApplicationSet supplies namespace, coordination ID, and
# shared-ZooKeeper service parameters per generated Application.
images:
  broker:
    repository: example.invalid/ecr-mirror/activemq-artemis-broker-kubernetes
  init:
    repository: example.invalid/ecr-mirror/activemq-artemis-broker-init
broker:
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "1"
      memory: 3Gi
persistence:
  storageClassName: PLACEHOLDER_TEST_GP3_STORAGE_CLASS

# Test uses smaller capacity while retaining the chart's quorum safeguards.
# The Argo CD Application supplies the nonprod image repository.

commonLabels:
  env: test

persistence:
  storageClass: PLACEHOLDER_TEST_GP3_STORAGE_CLASS
  size: 10Gi

resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: 500m
    memory: 1Gi

jvm:
  heapOpts: -Xms256m -Xmx512m

# Test spans two availability zones. Keep all three voters on separate hosts;
# the scheduler may place two voters in one zone and one in the other.
topology:
  minDomains: 2

# Permit ZooKeeper voters on the test cluster's on-demand platform nodes. The
# exact key/value/effect keeps unrelated protected node pools ineligible.
scheduling:
  tolerations:
    - key: eid-platform/node-lifecycle
      operator: Equal
      value: ondemand
      effect: NoSchedule

networkPolicy:
  brokerNamespaceSelector:
    matchLabels:
      messaging.example.io/cluster: PLACEHOLDER_TEST_EKS_CLUSTER
  monitoringNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: PLACEHOLDER_TEST_MONITORING_NAMESPACE

metrics:
  serviceMonitor:
    enabled: true
    labels:
      release: PLACEHOLDER_TEST_PROMETHEUS_RELEASE
  prometheusRule:
    enabled: true
    labels:
      release: PLACEHOLDER_TEST_PROMETHEUS_RELEASE

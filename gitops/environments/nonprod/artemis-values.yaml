# Release-candidate capacity with the same HA and ZooKeeper coordination
# semantics as test and prod.
images:
  broker:
    repository: example.invalid/ecr-mirror/activemq-artemis-broker-kubernetes
  init:
    repository: example.invalid/ecr-mirror/activemq-artemis-broker-init
broker:
  resources:
    requests:
      cpu: "1"
      memory: 4Gi
    limits:
      cpu: "2"
      memory: 6Gi
persistence:
  storageClassName: gp3
  size: 50Gi
console:
  ingress:
    host: artemis-nonprod.example.invalid
keycloak:
  redirectUri: https://artemis-nonprod.example.invalid/console

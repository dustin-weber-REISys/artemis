# Nonprod increases capacity for release-candidate and failure testing. The
# Argo CD Application supplies the nonprod image repository.

persistence:
  storageClass: PLACEHOLDER_NONPROD_GP3_STORAGE_CLASS

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: 1
    memory: 2Gi

jvm:
  heapOpts: -Xms512m -Xmx1Gi

networkPolicy:
  brokerNamespaceSelector:
    matchLabels:
      messaging.example.io/cluster: PLACEHOLDER_NONPROD_EKS_CLUSTER
  monitoringNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: PLACEHOLDER_NONPROD_MONITORING_NAMESPACE

metrics:
  serviceMonitor:
    enabled: true
    labels:
      release: PLACEHOLDER_NONPROD_PROMETHEUS_RELEASE
  prometheusRule:
    enabled: true
    labels:
      release: PLACEHOLDER_NONPROD_PROMETHEUS_RELEASE

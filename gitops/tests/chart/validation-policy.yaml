schemaVersion: validation.artemis.apache.org/chart-validation-policy/v1
kind: ChartValidationPolicy
description: >-
  Declarative policy consumed by chart validation; this file is not itself an
  executable chart test.
renderInputs:
  valuesFilesAreEnvironmentSupplied: true
  credentialsAllowedInValues: false
  publicBrokerLoadBalancerAllowed: false
requiredChecks:
  - helm-lint
  - helm-template
  - secret-pattern-scan
  - immutable-image-reference-check
  - active-passive-readiness-check
  - zone-spread-and-rwo-check
  - default-deny-network-policy-check
networkChecks:
  description: >-
    These checks require an explicit network schema mode and the Kubernetes
    version pinned in releases/current.yaml. Offline reports mark them NOT_RUN.
  requiredChecks:
    - kubeconform

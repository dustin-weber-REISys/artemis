apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: artemis-workloads
  namespace: PLACEHOLDER_ARGOCD_NAMESPACE
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://example.invalid/PLACEHOLDER_ORG/PLACEHOLDER_GITOPS_REPOSITORY.git
              revision: main
              files:
                - path: gitops/argocd/topology/catalog.yaml
          - list:
              # Expand broker pairs while retaining the catalog's cluster map
              # for environment-keyed lookups in the Application template.
              elementsYaml: '{{ .brokerPairs | toJson }}'
  template:
    metadata:
      name: '{{.brokerPairName}}-artemis'
      namespace: PLACEHOLDER_ARGOCD_NAMESPACE
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: messaging-platform
      source:
        repoURL: https://example.invalid/PLACEHOLDER_ORG/PLACEHOLDER_GITOPS_REPOSITORY.git
        targetRevision: main
        path: gitops/charts/artemis-ha
        helm:
          valueFiles:
            # Argo CD resolves same-repository values files relative to the
            # chart path (gitops/charts/artemis-ha), not the repository root.
            - ../../environments/{{.environment}}/artemis-values.yaml
          parameters:
            - name: ha.coordinationId
              # Explicit IDs keep every pair unique while satisfying the
              # chart's 8-16 character coordination ID constraint.
              value: '{{.coordinationId}}'
            - name: ha.groupName
              value: '{{.brokerPairName}}-group'
            - name: ha.clusterName
              value: '{{.brokerPairName}}-cluster'
            - name: zookeeper.connectString
              # The ZooKeeper Application uses the matching explicit Helm
              # release name: <environment>-shared-zookeeper.
              value: '{{.environment}}-shared-zookeeper-zookeeper-client.{{(index .clusters .environment).platformNamespace}}.svc.cluster.local:2181'
            - name: zookeeper.serviceNamespace
              value: '{{(index .clusters .environment).platformNamespace}}'
            # Curator namespaces are unique per HA pair even though the
            # ZooKeeper service is shared at cluster scope.
            - name: zookeeper.curatorNamespace
              value: 'artemis/{{.environment}}/{{.brokerPairName}}'
      destination:
        server: '{{(index .clusters .environment).clusterServer}}'
        namespace: '{{.workloadNamespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        managedNamespaceMetadata:
          labels:
            # The shared ZooKeeper NetworkPolicy admits only broker pods in
            # workload namespaces belonging to this EKS cluster.
            messaging.example.io/cluster: '{{(index .clusters .environment).clusterName}}'
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - ApplyOutOfSyncOnly=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m

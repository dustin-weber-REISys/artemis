schemaVersion: topology.artemis.apache.org/v1

# Cluster keys are stable environment identifiers. ApplicationSets expand the
# map values for cluster-scoped components and broker pairs reference the keys.
clusters:
  test:
    environment: test
    clusterName: PLACEHOLDER_TEST_EKS_CLUSTER
    clusterServer: https://PLACEHOLDER_TEST_EKS_API_SERVER
    platformNamespace: PLACEHOLDER_PLATFORM_NAMESPACE
  nonprod:
    environment: nonprod
    clusterName: PLACEHOLDER_NONPROD_EKS_CLUSTER
    clusterServer: https://PLACEHOLDER_NONPROD_EKS_API_SERVER
    platformNamespace: PLACEHOLDER_PLATFORM_NAMESPACE
  prod:
    environment: prod
    clusterName: PLACEHOLDER_PROD_EKS_CLUSTER
    clusterServer: https://PLACEHOLDER_PROD_EKS_API_SERVER
    platformNamespace: PLACEHOLDER_PLATFORM_NAMESPACE

# Each record represents one two-broker Artemis HA pair. Cluster connection
# details are resolved through the environment key above.
brokerPairs:
  - environment: test
    brokerPairName: test-sky
    workloadNamespace: PLACEHOLDER_TEST_NAMESPACE_SKY
    coordinationId: test-sky-01
  - environment: test
    brokerPairName: test-sky2
    workloadNamespace: PLACEHOLDER_TEST_NAMESPACE_SKY2
    coordinationId: test-sky2-01
  - environment: nonprod
    brokerPairName: nonprod-smktest-eut
    workloadNamespace: PLACEHOLDER_NONPROD_NAMESPACE_SMKTEST_EUT
    coordinationId: np-eut-pair01
  - environment: nonprod
    brokerPairName: nonprod-trn
    workloadNamespace: PLACEHOLDER_NONPROD_NAMESPACE_TRN
    coordinationId: np-trn-pair01
  - environment: nonprod
    brokerPairName: nonprod-trn2
    workloadNamespace: PLACEHOLDER_NONPROD_NAMESPACE_TRN2
    coordinationId: np-trn2-pair01
  - environment: nonprod
    brokerPairName: nonprod-pt
    workloadNamespace: PLACEHOLDER_NONPROD_NAMESPACE_PT
    coordinationId: np-pt-pair01
  - environment: prod
    brokerPairName: prod-pe
    workloadNamespace: PLACEHOLDER_PROD_NAMESPACE_PE
    coordinationId: prod-pe-pair01
  - environment: prod
    brokerPairName: prod-pp
    workloadNamespace: PLACEHOLDER_PROD_NAMESPACE_PP
    coordinationId: prod-pp-pair01
  - environment: prod
    brokerPairName: prod-dm
    workloadNamespace: PLACEHOLDER_PROD_NAMESPACE_DM
    coordinationId: prod-dm-pair01
  - environment: prod
    brokerPairName: prod-pr
    workloadNamespace: PLACEHOLDER_PROD_NAMESPACE_PR
    coordinationId: prod-pr-pair01

schemaVersion: topology.artemis.apache.org/v2
environment: nonprod
clusterName: PLACEHOLDER_NONPROD_EKS_CLUSTER
platformNamespace: artemis-platform

# This is the source of truth consumed directly by Argo CD. Edit Workload Cell
# identity, sizing, features, and enablement here; no generation step is needed.
# Replace placeholder-nonprod-domain.example.invalid with the full cluster domain
# on the work computer; retain the workloadNamespace subdomain.
workloadCells:
  - workloadCellName: nonprod-smktest-eut
    workloadNamespace: artemis-int-smktest-eut
    coordinationId: np-eut-pair01
    logicalEnvironment: SMKTEST-EUT
    trafficClass: internal
    managementHost: artemis-int-smktest-eut.placeholder-nonprod-domain.example.invalid
    storageSize: 50Gi
    profile: standard
    resources:
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        cpu: "2"
        memory: 6Gi
    # Dev teams can override these two standard Profile features per cell.
    # Keep {} for defaults, or replace it with either/both example settings:
    # features:
    #   expiryResources: true
    #   diskGuardrail: conservative
    # expiryResources: false (default) or true to configure expiry routing and
    #   automatically create expiry resources for expired messages. This does
    #   not set a message TTL.
    # diskGuardrail: standard (default, 90%) or conservative (80%) sets the
    #   broker's maximum disk-usage threshold.
    # These are the only supported feature keys; submit changes through GitOps.
    # Messaging permissions (send/consume/browse) are configured separately in
    # gitops/workloads/<environment>/<workloadCellName>/artemis-values.yaml
    # under authorization.rules for future external cells. Internal cells like
    # this one use networkPolicy.clientCidrs/clientSources for client access.
    features: {}
    enabled: "false"
  - workloadCellName: nonprod-trn
    workloadNamespace: artemis-int-trn
    coordinationId: np-trn-pair01
    logicalEnvironment: TRN
    trafficClass: internal
    managementHost: artemis-int-trn.placeholder-nonprod-domain.example.invalid
    storageSize: 50Gi
    profile: standard
    resources:
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        cpu: "2"
        memory: 6Gi
    features: {}
    enabled: "false"
  - workloadCellName: nonprod-trn2
    workloadNamespace: artemis-int-trn2
    coordinationId: np-trn2-pair01
    logicalEnvironment: TRN2
    trafficClass: internal
    managementHost: artemis-int-trn2.placeholder-nonprod-domain.example.invalid
    storageSize: 50Gi
    profile: standard
    resources:
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        cpu: "2"
        memory: 6Gi
    features: {}
    enabled: "false"
  - workloadCellName: nonprod-pt
    workloadNamespace: artemis-int-pt
    coordinationId: np-pt-pair01
    logicalEnvironment: PT
    trafficClass: internal
    managementHost: artemis-int-pt.placeholder-nonprod-domain.example.invalid
    storageSize: 50Gi
    profile: standard
    resources:
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        cpu: "2"
        memory: 6Gi
    features: {}
    enabled: "false"

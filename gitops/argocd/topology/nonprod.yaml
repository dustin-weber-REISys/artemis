schemaVersion: topology.artemis.apache.org/v2
environment: nonprod
clusterName: PLACEHOLDER_NONPROD_EKS_CLUSTER
platformNamespace: artemis-platform

# This is the source of truth consumed directly by Argo CD. Edit Workload Cell

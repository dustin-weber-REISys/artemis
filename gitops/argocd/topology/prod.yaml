schemaVersion: topology.artemis.apache.org/v3
environment: prod
clusterName: PLACEHOLDER_PROD_EKS_CLUSTER
platformNamespace: artemis-platform

# PE, PP, DM, and PR each receive one internal active/passive pair. PP and PR
# also receive a separate external pair. The environment overlay owns runtime
# sizing, feature selection, and enablement only.
workloadCellOverrides:
  prod-pe:
    resources:
      requests: {cpu: "1", memory: 4Gi}
      limits: {cpu: "2", memory: 6Gi}
    features: {diskGuardrail: conservative}
    enabled: "false"
  prod-pp:
    resources:
      requests: {cpu: "1", memory: 4Gi}
      limits: {cpu: "2", memory: 6Gi}
    features: {diskGuardrail: conservative}
    enabled: "false"
  prod-pp-external:
    resources:
      requests: {cpu: "1", memory: 4Gi}
      limits: {cpu: "2", memory: 6Gi}
    features: {diskGuardrail: conservative}
    enabled: "false"
  prod-pp-batch:
    resources:
      requests: {cpu: "1", memory: 4Gi}
      limits: {cpu: "2", memory: 6Gi}
    features: {diskGuardrail: conservative}
    enabled: "false"
  prod-dm:
    resources:
      requests: {cpu: "1", memory: 4Gi}
      limits: {cpu: "2", memory: 6Gi}
    features: {diskGuardrail: conservative}
    enabled: "false"
  prod-pr:
    resources:
      requests: {cpu: "1", memory: 4Gi}
      limits: {cpu: "2", memory: 6Gi}
    features: {diskGuardrail: conservative}
    enabled: "false"
  prod-pr-external:
    resources:
      requests: {cpu: "1", memory: 4Gi}
      limits: {cpu: "2", memory: 6Gi}
    features: {diskGuardrail: conservative}
    enabled: "false"
  prod-pr-batch:
    resources:
      requests: {cpu: "1", memory: 4Gi}
      limits: {cpu: "2", memory: 6Gi}
    features: {diskGuardrail: conservative}
    enabled: "false"

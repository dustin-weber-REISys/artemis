apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nonprod-shared-zookeeper
  namespace: PLACEHOLDER_ARGOCD_NAMESPACE
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: messaging-platform
  source:
    repoURL: https://example.invalid/PLACEHOLDER_ORG/PLACEHOLDER_GITOPS_REPOSITORY.git
    targetRevision: PLACEHOLDER_GITOPS_REVISION
    path: gitops/charts/zookeeper
    helm:
      releaseName: nonprod-shared-zookeeper
      valueFiles:
        - ../../environments/nonprod/zookeeper-values.yaml
      parameters:
        - name: image.repository
          value: PLACEHOLDER_NONPROD_ECR_REPOSITORY/zookeeper
  destination:
    server: https://kubernetes.default.svc
    namespace: PLACEHOLDER_PLATFORM_NAMESPACE
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

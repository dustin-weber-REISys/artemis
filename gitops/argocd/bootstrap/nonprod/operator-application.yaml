apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nonprod-arkmq-operator
  namespace: PLACEHOLDER_ARGOCD_NAMESPACE
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: messaging-platform
  sources:
    - repoURL: PLACEHOLDER_NONPROD_ECR_REPOSITORY/helm
      chart: arkmq-org-broker-operator
      targetRevision: "2.2.0"
      helm:
        releaseName: nonprod-arkmq-operator
        valueFiles:
          - $values/gitops/operator-values.yaml
        parameters:
          - name: controllerManager.manager.image.repository
            value: PLACEHOLDER_NONPROD_ECR_REPOSITORY/arkmq-operator
          - name: controllerManager.manager.relatedImages.activemqArtemisBrokerInitRepository
            value: PLACEHOLDER_NONPROD_ECR_REPOSITORY/activemq-artemis-broker-init
          - name: controllerManager.manager.relatedImages.activemqArtemisBrokerKubernetesRepository
            value: PLACEHOLDER_NONPROD_ECR_REPOSITORY/activemq-artemis-broker-kubernetes
    - repoURL: https://example.invalid/PLACEHOLDER_ORG/PLACEHOLDER_GITOPS_REPOSITORY.git
      targetRevision: PLACEHOLDER_GITOPS_REVISION
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: PLACEHOLDER_PLATFORM_NAMESPACE
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

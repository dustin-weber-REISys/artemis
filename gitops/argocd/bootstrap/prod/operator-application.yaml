apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-arkmq-operator
  namespace: PLACEHOLDER_ARGOCD_NAMESPACE
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: messaging-platform
  source:
    repoURL: https://example.invalid/PLACEHOLDER_ORG/PLACEHOLDER_GITOPS_REPOSITORY.git
    targetRevision: PLACEHOLDER_GITOPS_REVISION
    path: gitops/charts/arkmq-operator
    helm:
      releaseName: prod-arkmq-operator
      parameters:
        - name: global.requiredLabels.env
          value: prod
        - name: arkmq-org-broker-operator.controllerManager.manager.image.repository
          value: PLACEHOLDER_PROD_ECR_REPOSITORY/arkmq-operator
        - name: arkmq-org-broker-operator.controllerManager.manager.relatedImages.activemqArtemisBrokerInitRepository
          value: PLACEHOLDER_PROD_ECR_REPOSITORY/activemq-artemis-broker-init
        - name: arkmq-org-broker-operator.controllerManager.manager.relatedImages.activemqArtemisBrokerKubernetesRepository
          value: PLACEHOLDER_PROD_ECR_REPOSITORY/activemq-artemis-broker-kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: PLACEHOLDER_PLATFORM_NAMESPACE
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

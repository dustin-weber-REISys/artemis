apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: messaging-platform
  namespace: PLACEHOLDER_ARGOCD_NAMESPACE
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
spec:
  description: Artemis messaging platform workloads in the production cluster
  sourceRepos:
    - https://example.invalid/PLACEHOLDER_ORG/PLACEHOLDER_GITOPS_REPOSITORY.git
    - quay.io/arkmq-org/helm-charts/arkmq-org-broker-operator
  destinations:
    - server: https://kubernetes.default.svc
      namespace: PLACEHOLDER_PLATFORM_NAMESPACE
    - server: https://kubernetes.default.svc
      namespace: PLACEHOLDER_PROD_NAMESPACE_PE
    - server: https://kubernetes.default.svc
      namespace: PLACEHOLDER_PROD_NAMESPACE_PP
    - server: https://kubernetes.default.svc
      namespace: PLACEHOLDER_PROD_NAMESPACE_PP_EXTERNAL
    - server: https://kubernetes.default.svc
      namespace: PLACEHOLDER_PROD_NAMESPACE_PP_BATCH
    - server: https://kubernetes.default.svc
      namespace: PLACEHOLDER_PROD_NAMESPACE_DM
    - server: https://kubernetes.default.svc
      namespace: PLACEHOLDER_PROD_NAMESPACE_PR
    - server: https://kubernetes.default.svc
      namespace: PLACEHOLDER_PROD_NAMESPACE_PR_EXTERNAL
    - server: https://kubernetes.default.svc
      namespace: PLACEHOLDER_PROD_NAMESPACE_PR_BATCH
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding

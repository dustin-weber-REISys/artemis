apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: test-arkmq-operator
  namespace: PLACEHOLDER_ARGOCD_NAMESPACE
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: messaging-platform
  source:
    repoURL: https://example.invalid/PLACEHOLDER_ORG/PLACEHOLDER_GITOPS_REPOSITORY.git
    targetRevision: PLACEHOLDER_GITOPS_REVISION
    path: gitops/charts/arkmq-operator
    helm:
      releaseName: test-arkmq-operator
      parameters:
        - name: global.requiredLabels.env
          value: test
        - name: arkmq-org-broker-operator.clusterScoped
          value: "true"
        - name: arkmq-org-broker-operator.controllerManager.manager.image.repository
          value: PLACEHOLDER_NONPROD_ECR_REPOSITORY/arkmq-operator
        # The private mirror owns its registry digest. Do not combine this ECR
        # repository with the digest of the upstream Quay manifest.
        - name: arkmq-org-broker-operator.controllerManager.manager.image.tag
          value: "2.2.0"
        - name: arkmq-org-broker-operator.controllerManager.manager.relatedImages.activemqArtemisBrokerInitRepository
          value: PLACEHOLDER_NONPROD_ECR_REPOSITORY/activemq-artemis-broker-init
        - name: arkmq-org-broker-operator.controllerManager.manager.relatedImages.activemqArtemisBrokerKubernetesRepository
          value: PLACEHOLDER_NONPROD_ECR_REPOSITORY/activemq-artemis-broker-kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: PLACEHOLDER_PLATFORM_NAMESPACE
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      # Keep the original selector-incompatible Deployment available until
      # the replacement controller Deployment is healthy.
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

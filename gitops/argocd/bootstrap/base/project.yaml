apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: messaging-platform
  namespace: argocd
  labels:
    composition.artemis.apache.org/component: project
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
    composition.artemis.apache.org/environment: cluster
    composition.artemis.apache.org/catalog-path: gitops/argocd/catalogs/cluster.yaml
    composition.artemis.apache.org/git-revision: main
    composition.artemis.apache.org/repository: https://example.invalid/PLACEHOLDER_ORG/PLACEHOLDER_GITOPS_REPOSITORY.git
    composition.artemis.apache.org/platform-namespace: artemis-platform
spec:
  description: Artemis messaging platform workloads in the local cluster
  sourceRepos:
    - https://example.invalid/PLACEHOLDER_ORG/PLACEHOLDER_GITOPS_REPOSITORY.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: artemis-platform
    - server: https://kubernetes.default.svc
      namespace: artemis-*
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-artemis-workloads
  namespace: argocd
  labels:
    composition.artemis.apache.org/component: workloads
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://example.invalid/PLACEHOLDER_ORG/PLACEHOLDER_GITOPS_REPOSITORY.git
              revision: main
              files:
                - path: gitops/argocd/catalogs/cluster.yaml
          - list:
              elementsYaml: '{{ .workloadCells | toJson }}'
      selector:
        matchLabels:
          enabled: "true"
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: '{{.workloadCellName}}-artemis'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: messaging-platform
      source:
        repoURL: https://example.invalid/PLACEHOLDER_ORG/PLACEHOLDER_GITOPS_REPOSITORY.git
        targetRevision: main
        path: gitops/charts/artemis-ha
        helm:
          valueFiles:
            - ../../argocd/profiles/{{.profile}}/values.yaml
            - ../../environments/{{.environment}}/artemis-values.yaml
            - ../../workloads/{{.environment}}/{{.workloadCellName}}/artemis-values.yaml
          parameters:
            - name: ha.coordinationId
              value: '{{.coordinationId}}'
            - name: ha.groupName
              value: '{{.workloadCellName}}-group'
            - name: zookeeper.connectString
              value: '{{.environment}}-shared-zookeeper-zookeeper-client.{{.platformNamespace}}.svc.cluster.local:2181'
            - name: zookeeper.serviceNamespace
              value: '{{.platformNamespace}}'
            - name: zookeeper.curatorNamespace
              value: 'artemis/{{.environment}}/{{.workloadCellName}}'
            - name: persistence.size
              value: '{{.storageSize}}'
            - name: broker.resources.requests.cpu
              value: '{{.resources.requests.cpu}}'
              forceString: true
            - name: broker.resources.requests.memory
              value: '{{.resources.requests.memory}}'
              forceString: true
            - name: broker.resources.limits.cpu
              value: '{{.resources.limits.cpu}}'
              forceString: true
            - name: broker.resources.limits.memory
              value: '{{.resources.limits.memory}}'
              forceString: true
            - name: brokerProperties.maxDiskUsage
              value: '{{ if eq (dig "diskGuardrail" "standard" .features) "conservative" }}80{{ else }}90{{ end }}'
            - name: brokerProperties.addressSettings.expiry.enabled
              value: '{{ dig "expiryResources" "false" .features }}'
            - name: console.ingress.host
              value: '{{.managementHost}}'
            - name: keycloak.redirectUri
              value: 'https://{{.managementHost}}/console'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.workloadNamespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        managedNamespaceMetadata:
          labels:
            messaging.example.io/cluster: '{{.clusterName}}'
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - ApplyOutOfSyncOnly=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m

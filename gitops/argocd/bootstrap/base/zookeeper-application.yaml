apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-shared-zookeeper
  namespace: argocd
  labels:
    composition.artemis.apache.org/component: zookeeper
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: messaging-platform
  source:
    repoURL: https://example.invalid/PLACEHOLDER_ORG/PLACEHOLDER_GITOPS_REPOSITORY.git
    targetRevision: PLACEHOLDER_GITOPS_REVISION
    path: gitops/charts/zookeeper
    helm:
      releaseName: cluster-shared-zookeeper
      valueFiles:
        - ../../environments/cluster/zookeeper-values.yaml
      parameters:
        - name: image.repository
          value: PLACEHOLDER_NONPROD_ECR_REPOSITORY/zookeeper
  destination:
    server: https://kubernetes.default.svc
    namespace: artemis-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

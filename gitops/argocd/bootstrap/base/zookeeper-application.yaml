apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-shared-zookeeper
  namespace: argocd
  labels:
    composition.artemis.apache.org/component: zookeeper
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: messaging-platform
  source:
    repoURL: https://example.invalid/PLACEHOLDER_ORG/PLACEHOLDER_GITOPS_REPOSITORY.git
    targetRevision: main
    path: gitops/kustomize/zookeeper/overlays/cluster
  destination:
    server: https://kubernetes.default.svc
    namespace: artemis-platform 
  # Helm revisions before commonLabels were propagated to PVC templates and
  # later revisions produced different immutable StatefulSet claim metadata.
  # Preserve whichever template is already live during the Kustomize migration;
  # a new StatefulSet still receives the complete template from Kustomize.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates
  syncPolicy:
    automated:
      # ZooKeeper owns retained, AZ-bound volumes and a three-voter quorum.
      # Require the repository rollout preflight before an operator starts a
      # sync; an ordinary Git merge must not begin a voter restart by itself.
      enabled: false
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

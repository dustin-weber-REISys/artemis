apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-arkmq-operator
  namespace: PLACEHOLDER_ARGOCD_NAMESPACE
  labels:
    composition.artemis.apache.org/component: operator
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: messaging-platform
  source:
    repoURL: https://example.invalid/PLACEHOLDER_ORG/PLACEHOLDER_GITOPS_REPOSITORY.git
    targetRevision: PLACEHOLDER_GITOPS_REVISION
    path: gitops/kustomize/arkmq-operator/overlays/cluster
  destination:
    server: https://kubernetes.default.svc
    namespace: PLACEHOLDER_PLATFORM_NAMESPACE
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      # Keep the original selector-incompatible Deployment available until
      # the replacement controller Deployment is healthy.
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

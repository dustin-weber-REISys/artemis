{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "zookeeper.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zookeeper.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "zookeeper.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "zookeeper.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.service.client.port }}
          protocol: TCP
        {{- if .Values.tls.client.enabled }}
        - port: {{ .Values.tls.client.port }}
          protocol: TCP
        {{- end }}
        - port: 2888
          protocol: TCP
        - port: 3888
          protocol: TCP
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.brokerNamespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.brokerPodSelector | nindent 12 }}
      ports:
        - port: {{ .Values.service.client.port }}
          protocol: TCP
        {{- if .Values.tls.client.enabled }}
        - port: {{ .Values.tls.client.port }}
          protocol: TCP
        {{- end }}
    {{- if .Values.metrics.enabled }}
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.monitoringNamespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.monitoringPodSelector | nindent 12 }}
      ports:
        - port: {{ .Values.metrics.port }}
          protocol: TCP
    {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "zookeeper.selectorLabels" . | nindent 14 }}
      ports:
        - port: 2888
          protocol: TCP
        - port: 3888
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}

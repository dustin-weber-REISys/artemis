{{- if and .Values.enabled .Values.metrics.enabled .Values.metrics.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "zookeeper.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zookeeper.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: zookeeper-{{ include "zookeeper.fullname" . }}
      rules:
        - alert: ZooKeeperQuorumUnavailable
          expr: |
            sum by (namespace) (zookeeper_server_state{namespace="{{ .Release.Namespace }}"}) < 2
          for: {{ .Values.metrics.prometheusRule.rules.quorumUnavailableFor }}
          labels:
            severity: critical
          annotations:
            summary: ZooKeeper quorum is unavailable
            description: The shared ZooKeeper ensemble has fewer than two available members.
        - alert: ZooKeeperNoLeader
          expr: |
            sum by (namespace) (zookeeper_server_state{namespace="{{ .Release.Namespace }}", state="leader"}) < 1
          for: {{ .Values.metrics.prometheusRule.rules.quorumUnavailableFor }}
          labels:
            severity: warning
          annotations:
            summary: ZooKeeper has no elected leader
            description: ZooKeeper cannot coordinate broker activation without a leader.
{{- end }}

# Production keeps the promotion topology and tested artifact references;
# final capacity is confirmed from nonprod load results.
haMode: quorum
replicaCount: 2
coordination:
  backend: zookeeper
  zookeeper:
    ensembleMode: shared
    serviceName: PLACEHOLDER_SHARED_ZOOKEEPER_SERVICE
    serviceNamespace: PLACEHOLDER_PLATFORM_NAMESPACE
    curatorNamespace: PLACEHOLDER_PROD_CURATOR_NAMESPACE_FROM_APPLICATIONSET
    dedicatedEnsemble:
      enabled: false
resources:
  requests:
    cpu: 1
    memory: 4Gi
persistence:
  storageClass: PLACEHOLDER_PROD_GP3_STORAGE_CLASS
  size: 100Gi
